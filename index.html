 if(!D.sound)return;
 try{

{g:3,id:'nhan',i:'🔢',n:'Nhân số có hai chữ số với số có một chữ số',learn:['Tách số có hai chữ số thành chục và đơn vị.','Ví dụ: 23 × 4 = 20 × 4 + 3 × 4 = 80 + 12 = 92.','Mẹo: nhân từng phần rồi cộng lại, sẽ ít nhầm hơn.'],
 gen(){const a=R(12,49),b=R(2,9),t=a-a%10,u=a%10,s=a*b;return{q:`${a} × ${b} = ?`,ans:s,w:[t*b+u,s+10,s-10,t+u*b],s:[[`Tách ${a} = ${t} + ${u}`,`${a} = ${t} + ${u}`],[`Nhân từng phần: ${t} × ${b} = ${t*b} và ${u} × ${b} = ${u*b}`,`${t*b}  |  ${u*b}`],[`Cộng lại: ${t*b} + ${u*b} = ${s}`,'✅']]}}},
{g:5,id:'tp',i:'🔟',n:'Cộng số thập phân',learn:['Số thập phân có dấu phẩy ngăn phần nguyên và phần thập phân.','Khi cộng, viết các số thẳng hàng dấu phẩy, rồi cộng như số tự nhiên.','Ví dụ: 2,4 + 1,7 = 4,1.'],
 gen(){const a=R(11,89),b=R(11,89),s=a+b;return{q:`${fm(a/10)} + ${fm(b/10)} = ?`,ans:fm(s/10),w:[fm((s+1)/10),fm((s-1)/10),fm((s+10)/10),fm((s-10)/10)],s:[['Viết thẳng hàng dấu phẩy',`${fm(a/10)}\n+ ${fm(b/10)}`],[`Cộng như số tự nhiên: ${a} + ${b} = ${s}`,`${a} + ${b} = ${s}`],[`Đặt lại dấu phẩy: ${fm(s/10)}`,'✅']]}}},
{g:5,id:'pt',i:'％',n:'Tìm phần trăm của một số',learn:['Phần trăm là số phần trong 100 phần bằng nhau.','Muốn tìm p% của n: lấy n × p rồi chia cho 100.','Ví dụ: 25% của 80 = 80 × 25 ÷ 100 = 20.'],
 gen(){const p=P([10,20,25,50]),n=P([40,80,120,200]),s=n*p/100;return{q:`${p}% của ${n} là bao nhiêu?`,ans:s,w:[n/p,n-s,s*2,s+p],s:[[`${p}% nghĩa là ${p} phần trong 100 phần`,`${p}% = ${p}/100`],[`Tính: ${n} × ${p} = ${n*p}`,`${n} × ${p}`],[`Chia cho 100: ${n*p} ÷ 100 = ${s}`,'✅']]}}}
];
const fx=x=>String(x).replace(/\B(?=(\d{3})+(?!\d))/g,' '),fd=v=>String(+v.toFixed(3)).replace('.',',');
const SG=it=>()=>{const x=P(it),o=it.filter(y=>y!==x).sort(()=>Math.random()-.5),r=R(0,1);return{q:r?`${x[1]} là hình hay khối nào?`:`${x[2]}. Đó là gì?`,ans:x[0],w:o.map(y=>y[0]),s:[[r?'Nhìn hình dạng của vật':'Đọc kĩ đặc điểm của hình',r?x[1]:x[2]],[`Đặc điểm: ${x[2]}`,x[1]],[`Đó là ${x[0]}`,'✅']]}};
T.push(
{g:1,id:'so10',i:'⚖️',n:'So sánh các số trong phạm vi 10',learn:['So sánh hai số: số nào đứng sau trong dãy đếm thì lớn hơn.','Dấu > nghĩa là lớn hơn, dấu < nghĩa là bé hơn, dấu = nghĩa là bằng nhau.','Ví dụ: 7 > 4 vì 7 có nhiều hơn 4.'],
 gen(){const a=R(0,10),b=R(0,10),r=a>b?'>':a<b?'<':'=';return{q:`Điền dấu thích hợp: ${a} … ${b}`,ans:r,w:['>','<','='],s:[[`Đếm và so sánh ${a} với ${b}`,'🔵'.repeat(a)+'\n'+'🔴'.repeat(b)],[a>b?`${a} nhiều hơn ${b}, nên ${a} > ${b}`:a<b?`${a} ít hơn ${b}, nên ${a} < ${b}`:`Hai số bằng nhau: ${a} = ${b}`,'✅']]}}},
{g:1,id:'so100',i:'🔢',n:'Các số đến 100',learn:['Số có hai chữ số gồm chục và đơn vị.','Ví dụ: 47 gồm 4 chục và 7 đơn vị.','Số liền sau hơn số đó 1 đơn vị, số liền trước kém số đó 1 đơn vị.'],
 gen(){const n=R(11,99),t=Math.floor(n/10),u=n%10;return{q:`Số ${n} gồm mấy chục và mấy đơn vị?`,ans:`${t} chục ${u} đơn vị`,w:[`${u} chục ${t} đơn vị`,`${t+1} chục ${u} đơn vị`,`${t} chục ${(u+1)%10} đơn vị`],s:[[`Số ${n} có hai chữ số`,`${n}`],[`Chữ số hàng chục là ${t}, hàng đơn vị là ${u}`,`${t} chục  |  ${u} đơn vị`],[`Vậy ${n} gồm ${t} chục ${u} đơn vị`,'✅']]}}},
{g:2,id:'qua10',i:'🔟',n:'Cộng, trừ qua 10 trong phạm vi 20',learn:['Cộng qua 10: tách số để đủ 10 trước, rồi cộng phần còn lại.','Ví dụ: 8 + 5 = 8 + 2 + 3 = 10 + 3 = 13.','Trừ qua 10: trừ để về 10 trước, rồi trừ tiếp. Ví dụ: 13 − 5 = 13 − 3 − 2 = 10 − 2 = 8.'],
 gen(){if(R(0,1)){const a=R(6,9),b=R(11-a,9),s=a+b,k=10-a;return{q:`${a} + ${b} = ?`,ans:s,w:nd(s),s:[[`Tách ${b} = ${k} + ${b-k} để ${a} + ${k} đủ 10`,`${a} + ${k} = 10`],[`Còn lại ${b-k}: 10 + ${b-k} = ${s}`,`10 + ${b-k}`],[`Vậy ${a} + ${b} = ${s}`,'✅']]}}const a=R(11,18),b=R(a-9,9),s=a-b,k=a-10;return{q:`${a} − ${b} = ?`,ans:s,w:nd(s),s:[[`Trừ ${k} trước để về 10`,`${a} − ${k} = 10`],[`Còn phải trừ ${b-k}: 10 − ${b-k} = ${s}`,`10 − ${b-k}`],[`Vậy ${a} − ${b} = ${s}`,'✅']]}}},
{g:2,id:'tru100',i:'➖',n:'Trừ có nhớ trong phạm vi 100',learn:['Nếu chữ số hàng đơn vị của số bị trừ bé hơn số trừ thì mượn 1 chục (bằng 10 đơn vị).','Ví dụ: 52 − 17. Đơn vị: 12 − 7 = 5. Chục: 5 − 1 − 1 = 3. Kết quả 35.'],
 gen(){const ua=R(0,8),ub=R(ua+1,9),ta=R(2,9),tb=R(1,ta-1),a=ta*10+ua,b=tb*10+ub,s=a-b;return{q:`${a} − ${b} = ?`,ans:s,w:nd(s),s:[['Hàng đơn vị không trừ được, mượn 1 chục',`${ua+10} − ${ub} = ${ua+10-ub}`],[`Hàng chục: ${ta} − 1 (đã mượn) − ${tb} = ${ta-1-tb}`,`${ta-1-tb} chục`],[`Vậy ${a} − ${b} = ${s}`,'✅']]}}},
{g:2,id:'so1000',i:'🧱',n:'Các số trong phạm vi 1000',learn:['Số có ba chữ số gồm trăm, chục và đơn vị.','Ví dụ: 352 gồm 3 trăm, 5 chục và 2 đơn vị, và 352 = 300 + 50 + 2.','So sánh: số nào có nhiều chữ số hơn thì lớn hơn; cùng số chữ số thì so từng hàng từ trái sang phải.'],
 gen(){const h=R(1,9),t=R(0,9),u=R(0,9),n=h*100+t*10+u;return{q:`${h} trăm ${t} chục ${u} đơn vị là số nào?`,ans:n,w:[h*100+u*10+t,t*100+h*10+u,n+10,n+100],s:[[`${h} trăm = ${h*100}`,`${h*100}`],[`${t} chục = ${t*10} và ${u} đơn vị = ${u}`,`${t*10} + ${u}`],[`${h*100} + ${t*10} + ${u} = ${n}`,'✅']]}}},
{g:3,id:'bn',i:'✖️',n:'Bảng nhân 6, 7, 8, 9',learn:['Bảng nhân 6, 7, 8, 9 giúp tính nhanh nhiều lần cộng.','Ví dụ: 7 × 8 = 56; 9 × 6 = 54.','Mẹo: đổi chỗ hai thừa số thì tích không đổi, ví dụ 6 × 9 = 9 × 6.'],
 gen(){const a=P([6,7,8,9]),b=R(2,9),s=a*b;return{q:`${a} × ${b} = ?`,ans:s,w:[s+a,s-a,s+b,s-b],s:[[`${a} × ${b} nghĩa là ${b} nhóm, mỗi nhóm ${a}`,'🟩'.repeat(b)],[`Cộng dần ${a} lên ${b} lần`,Array.from({length:b},(_,i)=>a*(i+1)).join(' → ')],[`Vậy ${a} × ${b} = ${s}`,'✅']]}}},
{g:3,id:'dt',i:'🟦',n:'Diện tích hình chữ nhật, hình vuông',learn:['Diện tích là phần mặt phẳng mà hình chiếm. Đơn vị diện tích: cm² (xăng-ti-mét vuông).','Diện tích hình chữ nhật = chiều dài × chiều rộng.','Diện tích hình vuông = cạnh × cạnh.'],
 gen(){const sq=R(0,1),l=R(3,12),w=sq?l:R(2,l-1),s=l*w;return{q:sq?`Hình vuông cạnh ${l} cm. Diện tích là bao nhiêu cm²?`:`Hình chữ nhật dài ${l} cm, rộng ${w} cm. Diện tích là bao nhiêu cm²?`,ans:s,w:sq?[4*l,2*l,s+l,s-l]:[(l+w)*2,l+w,s+l,s-w],s:[[sq?'Diện tích hình vuông = cạnh × cạnh':'Diện tích hình chữ nhật = dài × rộng','▭'],[`${l} × ${w} = ${s}`,`${l} × ${w}`],[`Diện tích là ${s} cm²`,'✅']]}}},
{g:4,id:'lamtron',i:'🎯',n:'Làm tròn số',learn:['Làm tròn đến hàng chục, hàng trăm, hàng nghìn… là thay số bằng số tròn gần nhất.','Nhìn chữ số ở hàng bên phải: từ 5 trở lên thì làm tròn lên, dưới 5 thì giữ nguyên.','Ví dụ: 4 372 làm tròn đến hàng trăm là 4 400.'],
 gen(){const n=R(1000,9999),p=P([10,100,1000]),nm={10:'chục',100:'trăm',1000:'nghìn'}[p],fl=Math.floor(n/p)*p,a=Math.round(n/p)*p,nx=Math.floor(n/(p/10))%10;return{q:`Làm tròn số ${fx(n)} đến hàng ${nm}`,ans:fx(a),w:[fl===a?fl+p:fl,a+p,a-p,a+p/10].filter(x=>x>0).map(fx),s:[[`Tìm hàng ${nm}, rồi nhìn chữ số bên phải nó`,fx(n)],[`Chữ số bên phải là ${nx}: ${nx>=5?'từ 5 trở lên nên làm tròn lên':'dưới 5 nên giữ nguyên'}`,`${nx}`],[`Kết quả: ${fx(a)}`,'✅']]}}},
{g:4,id:'bt',i:'🧩',n:'Tính giá trị biểu thức',learn:['Biểu thức có dấu ngoặc: tính trong ngoặc trước.','Biểu thức không có ngoặc: nhân, chia trước; cộng, trừ sau.','Ví dụ: 3 + 4 × 2 = 3 + 8 = 11; (3 + 4) × 2 = 14.'],
 gen(){const a=R(2,9),b=R(2,9),c=R(2,9);if(R(0,1)){const s=a+b*c;return{q:`${a} + ${b} × ${c} = ?`,ans:s,w:[(a+b)*c,s+1,s-1,a*b+c],s:[['Nhân trước, cộng sau',`${a} + ${b} × ${c}`],[`${b} × ${c} = ${b*c}`,`${a} + ${b*c}`],[`${a} + ${b*c} = ${s}`,'✅']]}}const s=(a+b)*c;return{q:`(${a} + ${b}) × ${c} = ?`,ans:s,w:[a+b*c,s+c,s-c,a*c+b],s:[['Tính trong ngoặc trước',`(${a} + ${b}) × ${c}`],[`${a} + ${b} = ${a+b}`,`${a+b} × ${c}`],[`${a+b} × ${c} = ${s}`,'✅']]}}},
{g:4,id:'nhan2',i:'🧮',n:'Nhân với số có hai chữ số',learn:['Nhân với số có hai chữ số: nhân với chữ số hàng đơn vị, nhân với chục, rồi cộng hai kết quả.','Ví dụ: 23 × 12 = 23 × 2 + 23 × 10 = 46 + 230 = 276.'],
 gen(){const a=R(12,59),b=R(11,29),u=b%10,c=b-u,s=a*b;return{q:`${a} × ${b} = ?`,ans:s,w:[a*u+a*Math.floor(b/10),s+10,s-10,s+a],s:[[`Tách ${b} = ${u} + ${c}`,`${b} = ${u} + ${c}`],[`${a} × ${u} = ${a*u} và ${a} × ${c} = ${a*c}`,`${a*u}  |  ${a*c}`],[`Cộng lại: ${a*u} + ${a*c} = ${s}`,'✅']]}}},
{g:4,id:'dvd',i:'⚖️',n:'Đổi đơn vị đo khối lượng',learn:['1 yến = 10 kg; 1 tạ = 100 kg; 1 tấn = 1 000 kg.','Đổi từ đơn vị lớn ra đơn vị bé thì nhân; đổi từ đơn vị bé ra đơn vị lớn thì chia.','Ví dụ: 3 tạ = 3 × 100 = 300 kg.'],
 gen(){const u=P([['yến',10],['tạ',100],['tấn',1000]]),n=R(2,9),s=n*u[1];return{q:`${n} ${u[0]} = … kg`,ans:s,w:[s*10,s/10,s+u[1],s-u[1]],s:[[`1 ${u[0]} = ${u[1]} kg`,'⚖️'],[`${n} ${u[0]} = ${n} × ${u[1]}`,`${n} × ${u[1]}`],[`${n} ${u[0]} = ${s} kg`,'✅']]}}},
{g:5,id:'nhantp',i:'✖️',n:'Nhân số thập phân với 10, 100, 1000',learn:['Nhân một số thập phân với 10, 100, 1000… ta chuyển dấu phẩy sang bên phải 1, 2, 3… chữ số.','Ví dụ: 3,45 × 10 = 34,5; 3,45 × 100 = 345.'],
 gen(){const x=R(101,999),k=P([10,100,1000]),z=String(k).length-1;return{q:`${fd(x/100)} × ${k} = ?`,ans:fd(x*k/100),w:[x*k/1000,x*k/10,x*k/10000].map(fd),s:[[`Nhân với ${k}: chuyển dấu phẩy sang phải ${z} chữ số`,`${fd(x/100)} → ?`],['Nếu thiếu chữ số thì thêm chữ số 0',''],[`Kết quả: ${fd(x*k/100)}`,'✅']]}}},
{g:5,id:'dttg',i:'🔺',n:'Diện tích hình tam giác',learn:['Chiều cao của tam giác là đoạn vuông góc hạ từ đỉnh xuống đáy.','Diện tích tam giác = đáy × chiều cao ÷ 2.','Ví dụ: đáy 6 cm, chiều cao 4 cm thì diện tích = 6 × 4 ÷ 2 = 12 cm².'],
 gen(){const a=R(3,12),h=2*R(2,6),s=a*h/2;return{q:`Tam giác có đáy ${a} cm, chiều cao ${h} cm. Diện tích là bao nhiêu cm²?`,ans:s,w:[a*h,a+h,s+a,s-h],s:[['Diện tích = đáy × chiều cao ÷ 2','🔺'],[`${a} × ${h} = ${a*h}`,`${a} × ${h}`],[`${a*h} ÷ 2 = ${s} cm²`,'✅']]}}},
{g:5,id:'vantoc',i:'🚗',n:'Quãng đường, vận tốc, thời gian',learn:['Vận tốc cho biết quãng đường đi được trong một đơn vị thời gian, ví dụ 40 km/giờ.','Quãng đường = vận tốc × thời gian.','Ví dụ: ô tô đi 50 km/giờ trong 3 giờ thì đi được 50 × 3 = 150 km.'],
 gen(){const v=P([30,40,45,50,60]),t=R(2,6),s=v*t;return{q:`Một ô tô đi với vận tốc ${v} km/giờ trong ${t} giờ. Quãng đường đi được là bao nhiêu km?`,ans:s,w:[v+t,s+v,s-v,s+t],s:[['Quãng đường = vận tốc × thời gian','🚗'],[`${v} × ${t} = ${s}`,`${v} km × ${t} giờ`],[`Ô tô đi được ${s} km`,'✅']]}}},
{g:1,id:'hinh1',i:'🔺',n:'Làm quen với hình phẳng và hình khối',learn:['Hình vuông có 4 cạnh bằng nhau; hình chữ nhật có 4 cạnh, hai cạnh dài bằng nhau và hai cạnh ngắn bằng nhau.','Hình tam giác có 3 cạnh; hình tròn không có cạnh.','Khối lập phương có 6 mặt đều là hình vuông; khối hộp chữ nhật có 6 mặt là các hình chữ nhật.'],
 gen:SG([['hình vuông','🟦','Hình có 4 cạnh bằng nhau và 4 góc vuông'],['hình chữ nhật','▭','Hình có 4 cạnh, hai cạnh dài bằng nhau và hai cạnh ngắn bằng nhau'],['hình tam giác','🔺','Hình có 3 cạnh và 3 góc'],['hình tròn','🔵','Hình không có cạnh, có dạng tròn đều'],['khối lập phương','🎲','Khối có 6 mặt đều là hình vuông'],['khối hộp chữ nhật','📦','Khối có 6 mặt là các hình chữ nhật']])},
{g:2,id:'hinh2',i:'🥫',n:'Đoạn thẳng, đường gấp khúc, hình tứ giác, khối trụ, khối cầu',learn:['Khối trụ giống cái lon sữa, khối cầu giống quả bóng.','Hình tứ giác có 4 cạnh và 4 đỉnh.','Đoạn thẳng có hai đầu; đường thẳng kéo dài về hai phía; đường gấp khúc gồm các đoạn thẳng nối liền nhau.'],
 gen:SG([['khối trụ','🥫','Khối có hai mặt đáy là hình tròn, giống cái lon sữa'],['khối cầu','⚽','Khối tròn đều mọi phía, giống quả bóng'],['hình tứ giác','⬜','Hình có 4 cạnh và 4 đỉnh'],['đường gấp khúc','〰️','Hình gồm các đoạn thẳng nối liền nhau'],['đoạn thẳng','📏','Đường thẳng có điểm đầu và điểm cuối'],['đường thẳng','↔️','Đường không có điểm đầu và điểm cuối, kéo dài về hai phía']])},
{g:2,id:'lit',i:'🥛',n:'Lít và ki-lô-gam',learn:['Lít (viết tắt: l) dùng để đo dung tích, ví dụ lượng nước trong chai, trong thùng.','Ki-lô-gam (kg) dùng để đo khối lượng, ví dụ cân gạo, cân rau.','Tính với số đo có đơn vị: cộng, trừ các số rồi viết đơn vị vào kết quả. Ví dụ: 5 l + 3 l = 8 l.'],

()=>{const a=P([20,40,100,200]),p=P([5,10]),i=a*p/100,s=a+i;return{q:`Cô Hoa gửi tiết kiệm ${a} triệu đồng với lãi suất ${p}% một năm. Hỏi sau 1 năm, cô Hoa có tất cả bao nhiêu triệu đồng (cả vốn lẫn lãi)?`,ans:s,w:[i,a*p,a+p,a+2*i],s:[[`Tiền lãi sau 1 năm: ${a} × ${p} ÷ 100 = ${i} triệu đồng`,`${a} × ${p} ÷ 100`],[`Tổng số tiền: ${a} + ${i} = ${s}`,`${a} + ${i}`],[`Cô Hoa có ${s} triệu đồng`,'✅']]}});
EX.vantoc.push(()=>{const v1=P([40,45,50,60]),v2=P([30,35,40,55]),t1=R(2,4),t2=R(1,3),s=v1*t1+v2*t2;return{q:`Một ô tô đi với vận tốc ${v1} km/giờ trong ${t1} giờ, sau đó đi tiếp với vận tốc ${v2} km/giờ trong ${t2} giờ. Hỏi ô tô đã đi được tất cả bao nhiêu ki-lô-mét?`,ans:s,w:[(v1+v2)*(t1+t2),v1*t1,s+v2,s-v1],s:[[`Đoạn đầu: ${v1} × ${t1} = ${v1*t1} km`,`${v1} × ${t1}`],[`Đoạn sau: ${v2} × ${t2} = ${v2*t2} km`,`${v2} × ${t2}`],[`Tất cả: ${v1*t1} + ${v2*t2} = ${s} km`,'✅']]}},
()=>{const v1=P([40,45,50,60]),v2=P([30,35,40,55]),t=R(2,5),s=(v1+v2)*t;return{q:`Hai xe xuất phát cùng lúc từ hai tỉnh A và B, đi ngược chiều để gặp nhau. Vận tốc xe thứ nhất là ${v1} km/giờ, xe thứ hai là ${v2} km/giờ. Sau ${t} giờ hai xe gặp nhau. Hỏi quãng đường AB dài bao nhiêu ki-lô-mét?`,ans:s,w:[Math.abs(v1-v2)*t,v1*t,(v1+v2)+t,s+v1],s:[[`Mỗi giờ hai xe cùng đi được: ${v1} + ${v2} = ${v1+v2} km`,`${v1} + ${v2}`],[`Sau ${t} giờ: ${v1+v2} × ${t} = ${s} km`,`${v1+v2} × ${t}`],[`Quãng đường AB dài ${s} km`,'✅']]}},
()=>{const h=R(6,9),v=P([40,45,50,60]),t=R(2,5),s=v*t;return{q:`Một ô tô xuất phát lúc ${h} giờ, đi với vận tốc ${v} km/giờ trên quãng đường dài ${s} km. Hỏi ô tô đến nơi lúc mấy giờ?`,ans:`${h+t} giờ`,w:[`${h+t+1} giờ`,`${h+t-1} giờ`,`${h+2*t} giờ`,`${h+t+2} giờ`],s:[['Thời gian = quãng đường ÷ vận tốc',`${s} ÷ ${v}`],[`${s} ÷ ${v} = ${t} giờ`,''],[`Đến nơi lúc: ${h} + ${t} = ${h+t} giờ`,'✅']]}});

// Tiến trình lưu trong trình duyệt (nếu bị chặn thì vẫn chạy, chỉ không nhớ)
let D={best:{},days:[],hist:[],name:'',theme:'auto',sound:true};
try{Object.assign(D,JSON.parse(localStorage.getItem('toanvui')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('toanvui',JSON.stringify(D))}catch(e){}};
let S={v:'home',g:1,t:'c10',q:null,open:true,rs:false},timers=[],V=[];
const $=s=>document.querySelector(s),tg=()=>T.filter(x=>x.g===S.g),cur=()=>T.find(x=>x.id===S.t),tn=id=>T.find(x=>x.id===id);
const lvl=id=>{const b=D.best[id];return b===undefined?0:b<=2?1:b-1};
const LV=['Chưa học','Cần cố gắng','Đã hiểu bài','Thành thạo','Tinh thông'],LC=['#b8bcc8','#f0a500','#f0a500','#2faa6b','#7fdca8'];
const rec=()=>(tg().find(t=>lvl(t.id)<3)||tg()[0]).id;
const dk=d=>{d=new Date(d);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const dset=()=>new Set([...D.days,...D.hist.map(h=>dk(h.ts))]);
function streak(){const s=dset();let n=0,d=new Date();if(!s.has(dk(d)))d.setDate(d.getDate()-1);while(s.has(dk(d))){n++;d.setDate(d.getDate()-1)}return n}
function renderFire(){const n=streak(),f=$('#fire');f.className='fire'+(n?'':' off');f.textContent='🔥 '+n;f.title='Chuỗi ngày học liên tiếp'}
function streakPanel(){const s=dset(),n=streak(),t=s.has(dk(Date.now()));
 const w=[6,5,4,3,2,1,0].map(i=>{const d=new Date();d.setDate(d.getDate()-i);const ok=s.has(dk(d));return `<div>${['CN','T2','T3','T4','T5','T6','T7'][d.getDay()]}<i class="${ok?'ok':''}">${ok?'✓':''}</i></div>`}).join('');
 return `<section class="pn"><div class="ph"><h3>Chuỗi<br>ngày học</h3><span>🔥</span></div><p class="sk"><b>${n}</b> ngày liên tiếp</p><div class="wk">${w}</div><div class="mut">${t?'Hôm nay bạn đã giữ chuỗi. Hẹn gặp lại ngày mai!':n?'Làm một lượt quiz hôm nay để giữ chuỗi nhé!':'Làm một lượt quiz hôm nay để bắt đầu chuỗi!'}</div></section>`}
function renderWho(){const n=D.name.trim();$('#who').innerHTML=n?`<b>${esc([...n][0].toUpperCase())}</b><span>${esc(n)}</span>`:'<b>?</b><span>Đặt tên</span>'}
function applyTheme(){const r=document.documentElement;D.theme==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',D.theme)}
function go(v){S.v=v;S.q=null;S.rs=false;draw();window.scrollTo(0,0)}
function setGrade(g){S.g=g;S.t=tg()[0].id;S.q=null;if(S.v==='quiz')S.v='home';draw()}
function start(id){S.t=id;S.v='quiz';S.q=null;draw();window.scrollTo(0,0)}
function study(id){S.t=id;S.v='guide';draw();window.scrollTo(0,0)}
function draw(){
 timers.forEach(clearTimeout);timers=[];applyTheme();renderWho();renderFire();
 $('#gsel').innerHTML=`<i></i><select aria-label="Chọn lớp" onchange="setGrade(+this.value)">${[1,2,3,4,5].map(g=>`<option value="${g}"${g===S.g?' selected':''}>Lớp ${g}</option>`).join('')}</select>`;
 const a=S.v==='quiz'?'home':S.v,it=[['home','🏫','Các lớp'],['guide','🧭','Hướng dẫn tôi'],['hist','🕘','Lịch sử'],['set','⚙️','Cài đặt'],['help','❓','Trợ giúp']];
 $('#nav').innerHTML=it.map((x,i)=>`${i===3?'<div class="sp"></div>':''}<button class="nv${x[0]===a?' on':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('');
 $('#aside').innerHTML='';
 ({home,guide,quiz,hist,set:setv,help})[S.v]();
}
function topicCard(t){const l=lvl(t.id),b=D.best[t.id];
 return `<div class="tc"><div class="ti">${t.i}</div><div class="tx"><b>${t.n}</b><small><span class="bd" style="background:${LC[l]}"></span>${LV[l]}${b!==undefined?` · cao nhất ${b}/5`:''}</small></div><div class="ta"><button class="btn alt sm" onclick="study('${t.id}')">Học bài</button><button class="btn sm" onclick="start('${t.id}')">Làm quiz</button></div></div>`}
function home(){
 const nm=D.name?esc(D.name):'Bạn';
 
 $('#app').innerHTML=`<section class="hero"><h1>${nm} ơi, hôm nay mình cùng học toán nhé!</h1><p>Bạn chắc chắn sẽ làm được! Mỗi bước tiến đều sẽ giúp bạn trưởng thành hơn.</p><div class="btns"><button class="btn" onclick="start(rec())">Bắt đầu</button><button class="btn alt" onclick="S.open=true;draw();$('#list').scrollIntoView({behavior:'smooth'})">Xem tất cả bài tập</button></div></section><div class="sh"><h2>Các bài học</h2><button class="lk" onclick="S.open=!S.open;draw()">${S.open?'Đóng tất cả':'Mở tất cả'}</button></div><div id="list">${S.open?tg().map(topicCard).join(''):''}</div>`;
 const c=[0,0,0,0,0];T.forEach(t=>{if(D.best[t.id]!==undefined)c[lvl(t.id)]++});
 $('#aside').innerHTML=`${streakPanel()}<section class="pn"><div class="ph"><h3>Học tập<br>tinh thông</h3><span>👑</span></div>${[1,2,3,4].map(i=>`<div class="pr"><span class="bd" style="background:${LC[i]}"></span>${LV[i]}<b>${c[i]}</b></div>`).join('')}</section>`;
}
const yt=u=>{const m=/(?:youtu\.be\/|[?&]v=|embed\/)([\w-]{11})/.exec(u||'');return m?m[1]:null};
const canEmbed=()=>/^https?:$/.test(location.protocol)&&!/claude/i.test(location.hostname);
const ytBox=u=>canEmbed()?`<div class="yt"><iframe src="https://www.youtube.com/embed/${yt(u)}?rel=0" title="Video hướng dẫn" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></div><a class="lnk" href="${u}" target="_blank" rel="noopener">▶ Không xem được ở đây? Mở video trên YouTube</a>`:`<a class="ytc" href="${u}" target="_blank" rel="noopener"><span>▶</span><b>Xem video hướng dẫn</b><small>Bấm để mở video trên YouTube</small></a>`;
function vid(s){V=s;return `<div class="video"><div class="vb"><b>🎬 Video hướng dẫn</b><button onclick="play(V)">↻ Xem lại</button></div><div class="scr" id="scr"></div><div class="pg"><i id="pg"></i></div></div><video class="mine" controls playsinline preload="metadata" src="videos/${S.t}.mp4" onerror="this.remove()"></video>`}
function play(s){
 if(!$('#scr'))return;timers.forEach(clearTimeout);timers=[];const n=s.length;$('#pg').style.width='0';
 s.forEach((st,i)=>timers.push(setTimeout(()=>{$('#scr').innerHTML=`<div class="st"><small>Bước ${i+1}/${n}</small><div class="vis">${st[1]||''}</div><p>${st[0]}</p></div>`;$('#pg').style.width=((i+1)/n*100)+'%'},i*3000)))}
function dragScroll(el){let d=0,x=0,l=0,m=0;el.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;d=1;m=0;x=e.clientX;l=el.scrollLeft});el.addEventListener('pointermove',e=>{if(!d)return;const dx=e.clientX-x;if(Math.abs(dx)>4)m=1;el.scrollLeft=l-dx});['pointerup','pointerleave'].forEach(k=>el.addEventListener(k,()=>{d=0}));el.addEventListener('click',e=>{if(m){e.stopPropagation();e.preventDefault();m=0}},true)}
function guide(){
 const t=cur(),ex=t.gen();
 $('#app').innerHTML=`<div class="chips">${tg().map(x=>`<button class="chip${x.id===S.t?' on':''}" onclick="study('${x.id}')">${x.i} ${x.n}</button>`).join('')}</div>${yt(VL[t.id])?`<section class="card"><h2>${t.i} ${t.n}</h2>${ytBox(VL[t.id])}</section>`:`<section class="card"><h2>${t.i} ${t.n}</h2>${t.learn.map(x=>`<p class="ls">${x}</p>`).join('')}</section><section class="card"><h3>Xem ví dụ: ${ex.q}</h3>${vid(ex.s)}</section>`}<button class="btn wide" onclick="start('${t.id}')">Làm quiz bài này</button>`;
 play(ex.s);const cs=document.querySelector('.chips'),ac=document.querySelector('.chip.on');dragScroll(cs);if(ac)cs.scrollLeft=Math.max(0,ac.offsetLeft-cs.offsetLeft-12);
}
function mk(t){const q=P([t.gen,...(EX[t.id]||[])])(),a=String(q.ans),o=[a];q.w.forEach(x=>{x=String(x);if(!o.includes(x)&&o.length<4)o.push(x)});return{...q,ans:a,o:o.sort(()=>Math.random()-.5)}}
function quiz(){
 const t=cur();
 if(!S.q){const L=[],seen=new Set();let n=0;while(L.length<5&&n++<80){const c=mk(t);if(!seen.has(c.q)){seen.add(c.q);L.push(c)}}while(L.length<5)L.push(mk(t));S.q={l:L,i:0,sc:0}}
 const q=S.q;if(q.i>=5)return done();const c=q.l[q.i];
 $('#app').innerHTML=`<div class="qh"><button class="lk" onclick="go('home')">← Thoát</button><b>${t.i} ${t.n}</b></div><section class="card"><div class="meta">Câu ${q.i+1}/5 · ⭐ ${q.sc}</div><h2 class="qq">${c.q}</h2><div class="opts">${c.o.map(o=>`<button class="opt" onclick="ans(this,'${o}')">${esc(o)}</button>`).join('')}</div><div id="fb"></div></section>`;
}
function ans(b,v){
 const q=S.q,c=q.l[q.i],right=v===c.ans;
 document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.textContent===c.ans)x.classList.add('ok')});
 let h;
 if(right){q.sc++;sfx('ok');h='<div class="msg good">🎉 Giỏi lắm! Đúng rồi.</div>'}
 else{sfx('bad');b.classList.add('bad');h=`<div class="msg oops">Chưa đúng, không sao đâu! Đáp án đúng là <b>${c.ans}</b>. Xem video để biết cách sửa nhé:</div>${vid(c.s)}`}
 h+=`<button class="btn wide" onclick="nx()">${q.i<4?'Câu tiếp theo':'Xem kết quả 🏆'}</button>`;
 $('#fb').innerHTML=h;if(!right)play(c.s);
 $('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function nx(){S.q.i++;draw()}
function done(){
 const q=S.q,s=q.sc,t=cur(),st=s>=5?3:s>=3?2:s>=1?1:0;
 if(!q.rec){q.rec=1;sfx('done');D.hist.unshift({t:t.id,s,ts:Date.now()});D.hist=D.hist.slice(0,100);D.best[t.id]=Math.max(D.best[t.id]||0,s);const k=dk(Date.now());if(!D.days.includes(k))D.days.push(k);D.days=D.days.slice(-400);save();renderFire()}
 $('#app').innerHTML=`<section class="card ctr"><h2>Kết quả: ${s}/5</h2><div class="stars">${'⭐'.repeat(st)||'💪'}</div><p>${s>=4?'Xuất sắc! Bạn làm rất tốt.':'Cố gắng thêm chút nữa nhé, bạn làm được mà!'}</p><button class="btn wide" onclick="S.q=null;draw()">Làm lại</button><button class="btn alt wide" onclick="study('${t.id}')">Ôn lại bài</button><button class="btn alt wide" onclick="go('home')">Về trang chủ</button></section>`;
}
function hist(){
 const r=D.hist.slice(0,30).filter(h=>tn(h.t));
 $('#app').innerHTML=`<section class="card"><h2>Lịch sử làm bài</h2>${r.length?r.map(h=>`<div class="hr"><span>${tn(h.t).i} ${tn(h.t).n}</span><b>${h.s}/5</b><small>${new Date(h.ts).toLocaleString('vi-VN',{dateStyle:'short',timeStyle:'short'})}</small></div>`).join(''):'<p>Bạn chưa làm bài nào. Hãy bấm Bắt đầu ở trang Các lớp nhé!</p>'}</section>`;
}
function setv(){
 $('#app').innerHTML=`<section class="card"><h2>Cài đặt</h2><label for="nm">Tên của bạn</label><input class="fld" id="nm" maxlength="20" value="${esc(D.name)}" oninput="D.name=this.value;save();renderWho()"><label for="th">Giao diện</label><select class="fld" id="th" onchange="D.theme=this.value;save();applyTheme()">${[['auto','Tự động theo thiết bị'],['light','Sáng'],['dark','Tối']].map(x=>`<option value="${x[0]}"${D.theme===x[0]?' selected':''}>${x[1]}</option>`).join('')}</select><label for="sd">Âm thanh</label><select class="fld" id="sd" onchange="D.sound=this.value==='1';save();sfx('ok')"><option value="1"${D.sound?' selected':''}>Bật</option><option value="0"${D.sound?'':' selected'}>Tắt</option></select><label>Tiến trình</label><button class="btn alt sm" onclick="reset(this)">Xóa tiến trình</button></section>`;
}
function reset(b){if(!S.rs){S.rs=true;b.textContent='Bấm lần nữa để xóa hết';return}D.best={};D.hist=[];D.days=[];save();S.rs=false;draw()}
function help(){
 $('#app').innerHTML=`<section class="card"><h2>Trợ giúp</h2><p class="ls"><b>1. Chọn lớp</b> ở góc trên bên trái.</p><p class="ls"><b>2. Hướng dẫn tôi</b>: đọc bài và xem video ví dụ của từng chủ đề.</p><p class="ls"><b>3. Làm quiz</b>: mỗi lượt có 5 câu. Làm sai sẽ có video chỉ cách sửa.</p><p class="ls"><b>4. Mức thành thạo</b>: điểm cao nhất của mỗi bài quyết định mức: Cần cố gắng, Đã hiểu bài, Thành thạo, Tinh thông.</p><p class="ls"><b>5. Chuỗi ngày học 🔥</b>: mỗi ngày hoàn thành ít nhất 1 lượt quiz thì chuỗi tăng thêm 1. Bỏ lỡ một ngày thì chuỗi quay về 0.</p><p class="ls"><b>6. Âm thanh 🔊</b>: bật hoặc tắt trong mục Cài đặt.</p><p class="ls">Nội dung bám theo mạch kiến thức của SGK Toán bộ Kết nối tri thức với cuộc sống (lớp 1 đến lớp 5).</p><p class="ls">Tiến trình được lưu trong trình duyệt của thiết bị này.</p></section>`;
}
draw();
</script>
